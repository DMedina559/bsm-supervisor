name: Dependencies
on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - package.json
      - package-lock.json
      - .github/workflows/dependencies.yml
  pull_request:
    paths:
      - pyproject.toml
      - package.json
      - package-lock.json
      - .github/workflows/dependencies.yml
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --requirement <(python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb'))['project']; print('\n'.join(p['dependencies']+p['optional-dependencies']['all']))")
        shell: bash
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
