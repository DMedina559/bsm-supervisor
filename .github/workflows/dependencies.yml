name: Dependencies
on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --requirement <(python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb'))['project']; print('\n'.join(p['dependencies']+p['optional-dependencies']['all']))")
        shell: bash
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
