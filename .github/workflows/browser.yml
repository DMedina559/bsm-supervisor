name: Console browser tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: false
        default: ''
        type: string
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install '.[web]'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-browser-results
          path: test-results
