name: Tests
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,all]'
      - if: matrix.python == '3.14'
        run: python -m black --check --diff src tests
      - if: matrix.python == '3.14'
        run: python -m isort --check-only src tests
      - if: matrix.python == '3.14'
        run: python -m flake8 src tests
      - if: matrix.python == '3.14'
        run: python -m mypy src
      - run: python -m unittest discover -s tests -v
      - run: bsm-supervisor --help
      - if: matrix.python == '3.14'
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - if: matrix.python == '3.14'
        run: python -m pip install shellcheck-py
      - if: matrix.python == '3.14'
        run: shellcheck scripts/*.sh
