name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m black --check src tests
      - run: python -m isort --check-only src tests
      - run: python -m flake8 src tests
      - run: python -m mypy src
      - run: python -m unittest discover -s tests -v
      - run: bsm-supervisor --help
      - run: bash -n scripts/install-lxc.sh
      - run: python -m pip install shellcheck-py
      - run: shellcheck scripts/install-lxc.sh
