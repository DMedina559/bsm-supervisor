name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    uses: ./.github/workflows/browser.yml
  dependencies:
    uses: ./.github/workflows/dependencies.yml
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,all]'
      - run: python -m unittest discover -s tests -v
      - run: python -m black --check src tests
      - run: python -m isort --check-only src tests
      - run: python -m flake8 src tests
      - run: python -m mypy src
  release:
    needs: [test, browser, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install build packaging
      - name: Set the package version from the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          from packaging.version import Version
          tag = os.environ['RELEASE_TAG']
          version = str(Version(tag.removeprefix('v')))
          if tag != 'v' + version:
              raise SystemExit('Use a normalized Python version tag such as v0.1.0b1')
          path = Path('src/bsm_supervisor/__init__.py')
          content, count = re.subn(r'^__version__ = "[^\"]+"$', f'__version__ = "{version}"', path.read_text(), count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('Missing package version declaration')
          path.write_text(content)
          PY
      - run: python -m build
      - name: Verify packaged console assets and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install dist/*.whl
          /tmp/release-check/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import bsm_supervisor
          assert version('bsm-supervisor') == os.environ['RELEASE_TAG'][1:]
          for name in ('index.html', 'app.js', 'style.css'):
              assert (Path(bsm_supervisor.__file__).parent / 'assets' / name).is_file()
          PY
      - name: Create pinned bootstrap assets and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cp scripts/install-lxc.sh scripts/provision-proxmox.sh dist/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist')
          for name in ('install-lxc.sh', 'provision-proxmox.sh'):
              path = root / name
              path.write_text(path.read_text().replace('ref=latest\n', 'ref=' + os.environ['RELEASE_SHA'] + '\n', 1).replace('package_version=\n', 'package_version=' + os.environ['RELEASE_TAG'][1:] + '\n', 1))
          (root / 'release.json').write_text(json.dumps({'tag': os.environ['RELEASE_TAG'], 'commit': os.environ['RELEASE_SHA']}, indent=2))
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in sorted(root.iterdir())))
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if python -c 'import os; from packaging.version import Version; raise SystemExit(not Version(os.environ["RELEASE_TAG"][1:]).is_prerelease)'; then
            args+=(--prerelease)
          fi
          printf '%s\n' 'Experimental software. Validate recovery in a disposable LXC before deployment.' > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --notes-file /tmp/release-notes.md "${args[@]}"
