name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or repair
        required: true
        type: string
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the existing release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9][A-Za-z0-9.+!-]*$ ]] || { echo 'Invalid release tag'; exit 1; }
          revision=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ $GITHUB_EVENT_NAME == push && $revision != "$GITHUB_SHA" ]]; then
            echo 'Release tag changed after the push event' >&2
            exit 1
          fi
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$revision" >> "$GITHUB_OUTPUT"
  browser:
    needs: source
    uses: ./.github/workflows/browser.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  dependencies:
    needs: source
    uses: ./.github/workflows/dependencies.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  test:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,all]'
      - run: python -m unittest discover -s tests -v
      - run: python -m black --check src tests
      - run: python -m isort --check-only src tests
      - run: python -m flake8 src tests
      - run: python -m mypy src
  release:
    needs: [source, test, browser, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build packaging
      - name: Set the package version from the release tag
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          from packaging.version import Version
          tag = os.environ['RELEASE_TAG']
          version = str(Version(tag.removeprefix('v')))
          if tag != 'v' + version:
              raise SystemExit('Use a normalized Python version tag such as v0.1.0b1')
          path = Path('src/bsm_supervisor/__init__.py')
          content, count = re.subn(r'^__version__ = "[^\"]+"$', f'__version__ = "{version}"', path.read_text(), count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('Missing package version declaration')
          path.write_text(content)
          PY
      - run: python -m build
      - name: Verify packaged console assets and version
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install dist/*.whl
          /tmp/release-check/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import bsm_supervisor
          assert version('bsm-supervisor') == os.environ['RELEASE_TAG'][1:]
          for name in ('index.html', 'app.js', 'admin.js', 'style.css',
                       'frontend/tokens.css', 'frontend/base.css',
                       'frontend/buttons.css', 'frontend/forms.css',
                       'frontend/icon-192.png', 'frontend/favicon-96.png',
                       'frontend/LICENSE', 'frontend/SOURCE.json'):
              assert (Path(bsm_supervisor.__file__).parent / 'assets' / name).is_file()
          PY
      - name: Create pinned bootstrap assets and checksums
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          cp scripts/install-lxc.sh scripts/provision-proxmox.sh dist/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist')
          for name in ('install-lxc.sh', 'provision-proxmox.sh'):
              path = root / name
              path.write_text(path.read_text().replace('ref=latest\n', 'ref=' + os.environ['RELEASE_SHA'] + '\n', 1).replace('package_version=\n', 'package_version=' + os.environ['RELEASE_TAG'][1:] + '\n', 1))
          (root / 'release.json').write_text(json.dumps({'tag': os.environ['RELEASE_TAG'], 'commit': os.environ['RELEASE_SHA']}, indent=2))
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in sorted(root.iterdir())))
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          remote_revision=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          [[ $remote_revision == "$RELEASE_SHA" ]] || { echo 'Release tag moved during build'; exit 1; }
          args=()
          if python -c 'import os; from packaging.version import Version; raise SystemExit(not Version(os.environ["RELEASE_TAG"][1:]).is_prerelease)'; then
            args+=(--prerelease)
          fi
          printf '%s\n' 'Experimental software. Validate recovery in a disposable LXC before deployment.' > /tmp/release-notes.md
          if gh release view "$RELEASE_TAG" --json tagName --jq .tagName >/dev/null; then
            # Preserve the existing title, notes, draft and prerelease settings.
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --notes-file /tmp/release-notes.md "${args[@]}"
          fi
