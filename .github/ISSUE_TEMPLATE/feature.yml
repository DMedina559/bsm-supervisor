name: Feature request
description: Suggest an improvement to BSM Supervisor.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow and any alternatives you have considered.
    validations:
      required: true
