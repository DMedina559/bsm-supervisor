[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "bsm-supervisor"
dynamic = ["version"]
description = "Installation and service supervision for Bedrock Server Manager"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["packaging>=24,<27"]

[project.scripts]
bsm-supervisor = "bsm_supervisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.setuptools.package-data]
bsm_supervisor = ["assets/*.html", "assets/*.js", "assets/*.css", "assets/frontend/*"]

[project.optional-dependencies]
web = ["uvicorn>=0.32,<1"]
transfer = ["cryptography>=43,<52"]
all = ["uvicorn>=0.32,<1", "cryptography>=43,<52"]
dev = [
    "setuptools-scm>=8,<10",
    "black>=26.10,<27",
    "flake8>=7.4,<8",
    "isort>=9,<10",
    "mypy>=2.4,<3",
    "pre-commit>=4,<5",
]

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
