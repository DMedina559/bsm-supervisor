[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bsm-supervisor"
version = "0.1.0.dev0"
description = "Installation and service supervision for Bedrock Server Manager"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["packaging>=24,<27"]

[project.scripts]
bsm-supervisor = "bsm_supervisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "black>=26.10,<27",
    "flake8>=7.4,<8",
    "isort>=9,<10",
    "mypy>=2.4,<3",
    "pre-commit>=4,<5",
]

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
