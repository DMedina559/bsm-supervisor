state_dir = "/var/lib/bsm-supervisor"
installations_dir = "/opt/bsm/installations"
data_dir = "/srv/bsm"
service_unit = "bedrock-server-manager-webui.service"
service_timeout = 240
# LXC default: reachable on all IPv4 interfaces. Use 127.0.0.1 for a local proxy.
bsm_host = "0.0.0.0"
bsm_port = 11325
# Native Proxmox overrides also accept HOST / PORT, matching BSM's Docker entrypoint.
# Optional pinned bootstrap values (environment variables override TOML):
# bsm_db_url = "sqlite:////srv/bsm/config/bedrock-server-manager.db"
bsm_log_level = "INFO"

# Optional: adopt a BSM configuration directory outside data_dir.
# bsm_config_dir = "/etc/bedrock-server-manager"

# Declare every external directory needed for recovery.
# Directories contained by data_dir/config_dir are already included.
checkpoint_paths = []
# Example: checkpoint_paths = ["/mnt/bedrock-servers", "/mnt/bsm-content"]

# Required for authenticated application readiness during coordinated upgrades.
# Store a BSM bearer token in this private regular file (permissions 0600).
# api_token_file = "/var/lib/bsm-supervisor/bsm-api.token"
readiness_timeout = 60
